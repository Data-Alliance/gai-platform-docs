site_name: gcube Docs
site_url: https://data-alliance.github.io/gai-platform-docs/
docs_dir: docs

# 플러그인 설정
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            # A — 시작하기
            시작하기: Getting Started
            gcube란?: What is gcube?
            계정 만들기: Create Account
            프로필 설정: Profile Setup
            저장소 관리: Storage Management
            나는 공급자인가요, 소비자인가요?: Provider or Consumer?
            # B — GPU 사용하기 (워크로드 소비자)
            GPU 워크로드 사용하기: Use GPU
            워크로드 대시보드: Workload Dashboard
            워크로드 등록하기: Register Workload
            멀티 GPU 워크로드 등록: Register Multi-GPU Workload
            멀티 컨테이너 등록 예시: Multi-Container Registration Example
            워크로드 배포: Deploy Workload
            워크로드 SSH 터미널 접속: SSH Terminal Access
            워크로드 VS Code 익스텐션: VS Code Extension Access
            모니터링: Monitoring
            이용내역 확인: Check Usage History
            워크로드 종료: Terminate Workload
            # C — GPU 공유하기 (노드 공급자)
            GPU 공유하기: Share GPU
            노드 대시보드: Node Dashboard
            노드 연결하기: Connect Node
            에이전트 설치 및 세팅: Agent Setup
            공유 시작 및 중단: Start and Stop Sharing
            공유 정보 확인: Check Sharing Info
            가격 설정: Set Pricing
            수익 확인: Check Earnings
            모니터링 확인: Check Monitoring
            에이전트 모니터링 확인: Check Agent Monitoring
            문제 해결 (Troubleshooting): Troubleshooting
            # D — AI 모델 실행하기
            AI 모델 실행하기: Run AI Models
            Ollama - 외부 API 버전: Run Ollama - API 
            Ollama - SSH 접속 버전: Run Ollama - SSH
            OpenWebUI + ComfyUI 실행하기: Run OpenWebUI + ComfyUI
            OpenClaw 실행하기: Run OpenClaw
            # E — gcube CLI
            gcube CLI: gcube CLI
            CLI 시작하기: Getting Started
            설정 관리: Configuration
            GPU 목록 조회: GPU List
            워크로드 관리: Workload Management            
            리소스 모니터링: Resource Monitoring
            포인트 조회: Check Point 
            레지스트리 인증 관리: Registry Credentials
            사용 예시: Usage Examples


theme:
  name: material
  language: ko
  favicon: images/favicon.png
  logo: images/gcube_logo.svg
  font:
    text: Inter
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css
extra:
  homepage: https://console.gcube.ai/
  alternate:
    - name: 한국어
      link: /gai-platform-docs/
      lang: ko
    - name: English
      link: /gai-platform-docs/en/
      lang: en

markdown_extensions:
  - footnotes
#  - markdown_include.include
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["docs/snippets", "docs/admin"]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
        - class: mermaid


        - format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details 
  - admonition
  - attr_list
  - meta
  - tables
  - toc:
      permalink: False
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


